name: YallaEvent
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.0
  http_parser: ^4.0.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0    
  provider: ^6.0.5          
  smooth_page_indicator: ^1.1.0
  cupertino_icons: ^1.0.8
  intl: ^0.18.0
  url_launcher: ^6.3.0
  flutter_stripe: ^10.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1


flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo1.png"